server:
  port: 0

spring:
  application:
    name: producto-service
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 2000
        max-attempts: 10
        multiplier: 1.5
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_producto}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/8680c901-cdee-41fb-b489-95b35c8ffaf0/discovery/v2.0/keys
          issuer-uri: https://sts.windows.net/8680c901-cdee-41fb-b489-95b35c8ffaf0/
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    clean-on-validation-error: true